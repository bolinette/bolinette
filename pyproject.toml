[project]
name = "bolinette-workspace"
version = "0.20.0"
description = "The Bolinette workspace, not published: see the packages in packages/"
readme = "README.md"
authors = [{ name = "Pierre Chat", email = "pierrechat@outlook.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
dependencies = [
    "bolinette",
    "bolinette-data",
    "bolinette-web[auth]",
    "bolinette-api",
]

[dependency-groups]
dev = ["ruff>=0.16.8", "pyright>=1.1.414"]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "aiosqlite>=0.21.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bolinette = { workspace = true }
bolinette-data = { workspace = true }
bolinette-web = { workspace = true }
bolinette-api = { workspace = true }

[tool.pyright]
include = ["packages", "tests", "scripts"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
deprecateTypingAliases = true
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUninitializedInstanceVariable = "none"
reportDeprecated = "none"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "F",
    "B",
    "Q",
    "I",
    "N",
    "RUF",
    "UP",
    "BLE",
    "DTZ",
    "ERA",
    "FLY",
    "FURB",
    "LOG",
    "PIE",
    "PLE",
    "SLOT",
    "TID",
    "YTT",
    "ASYNC",
    "C4",
    "G",
    "PERF",
    "PGH",
    "PT",
    "RET",
    "RSE",
    "T20",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["bolinette"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["I001"]
"**/__main__.py" = ["T201"]
"**/_bundled/*" = ["T201"]
"scripts/*" = ["T201"]
"tests/**" = ["ASYNC240"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true
addopts = "-ra"
markers = [
    "known_bug(reason): intended behaviour the package does not implement yet; turned into a strict xfail",
]
