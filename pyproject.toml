[project]
name = "bolinette-workspace"
version = "0.20.0"
description = "The Bolinette workspace, not published: see the packages in packages/"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bolinette",
    "bolinette-data",
    "bolinette-web[auth]",
    "bolinette-api",
]

[dependency-groups]
dev = ["ruff>=0.14.2", "pyright>=1.1.407"]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "aiosqlite>=0.21.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bolinette = { workspace = true }
bolinette-data = { workspace = true }
bolinette-web = { workspace = true }
bolinette-api = { workspace = true }

[tool.pyright]
include = ["packages", "tests", "scripts"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E", "W", "F", "B", "Q", "I", "N", "RUF", "UP"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["bolinette"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["I001"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true
addopts = "-ra"
markers = [
    "known_bug(reason): intended behaviour the package does not implement yet; turned into a strict xfail",
]
