[project]
name = "bolinette-data"
version = "0.20.0"
description = "The Bolinette data extension: SQLAlchemy based relational layer."
readme = "README.md"
authors = [{ name = "Pierre Chat", email = "pierrechat@outlook.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
dependencies = ["bolinette==0.20.0", "sqlalchemy>=2.0.51"]

[project.entry-points."bolinette.extensions"]
data = "bolinette.data:DataExtension"

[build-system]
requires = ["uv_build>=0.9.23,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bolinette.data"
module-root = ""
namespace = true
