[project]
name = "bolinette-web"
version = "0.20.0"
description = "The Bolinette web extension."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bolinette==0.20.0",
]

[project.optional-dependencies]
auth = ["pyjwt[crypto]>=2.10"]

[project.entry-points."bolinette.extensions"]
web = "bolinette.web:WebExtension"

[build-system]
requires = ["uv_build>=0.9.23,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bolinette.web"
module-root = ""
namespace = true
